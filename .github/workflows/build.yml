name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test tests/Envoy.Core.Tests/Envoy.Core.Tests.csproj -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.0" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        run: dotnet publish src/Envoy.App/Envoy.App.csproj -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      # Launches the real exe, builds every window under every theme, runs one capture + OCR pass, then exits.
      - name: Smoke test
        shell: pwsh
        run: |
          $log = Join-Path $PWD "smoke.log"
          $p = Start-Process -FilePath "publish/Envoy.exe" -ArgumentList "--smoke-test", "`"$log`"" -PassThru
          $null = $p.Handle  # needed so ExitCode is available later
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "Smoke test timed out"; exit 1 }
          if (Test-Path $log) { Get-Content $log }
          $errors = Join-Path $env:APPDATA "Envoy/error.log"
          if (Test-Path $errors) { Get-Content $errors }
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed with exit code $($p.ExitCode)"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Envoy-win-x64
          path: publish/Envoy.exe

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Envoy.exe
          generate_release_notes: true
